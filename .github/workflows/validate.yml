name: Validate
# Every push to main and every pull request: schema + integrity, regression tests, mass-deletion guard,
# a real browser opening the site on a laptop and a phone, the full browser suite, and a lint of the workflows.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04  # pinned: the browser test needs an OS Playwright supports
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/validate.mjs
      - run: node scripts/test.mjs
      - name: Nothing lost
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then node scripts/guard.mjs --base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then node scripts/guard.mjs --base="$BEFORE"
          else node scripts/guard.mjs --base=HEAD~1; fi
      - name: Browser smoke test
        run: |
          npm i --no-save playwright@1.55.0
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; sleep 20; done
          node scripts/smoke.mjs
      - name: Full browser suite (screens, phones, touch, zoom, every card, missing data)
        timeout-minutes: 12
        run: node scripts/e2e.mjs
  workflows:
    # a typo in a workflow fails silently at 05:40 the next morning; this catches it on the pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub workflows (actionlint, official image)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color -shellcheck= -pyflakes=
