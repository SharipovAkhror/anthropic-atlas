name: Production health
# Every hour: open the live site in a real browser (laptop + phone). If it is broken twice in a row and the
# latest commit on main only changed data (a daily update or the collector), revert that commit automatically:
# the site returns to the last good version without anyone waking up. Code changes are never auto-reverted;
# the failed run notifies the repository owner instead.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-main-writer
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-24.04  # pinned: the browser test needs an OS Playwright supports
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm i --no-save playwright@1.55.0
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; sleep 20; done
      - name: Data is fresh (the morning job ran in the last two days)
        run: |
          newest=$(curl -fsS https://anthropic-atlas.vercel.app/data/digests/index.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).digests[0].date))')
          limit=$(TZ=Asia/Tashkent date -d '2 days ago' +%F)
          echo "newest digest $newest, limit $limit"
          if [[ "$newest" < "$limit" ]]; then echo "::error::The site has not been updated since $newest: the morning job or the deploy is stuck."; exit 1; fi
      - name: Check production
        id: check
        timeout-minutes: 10
        run: |
          node scripts/smoke.mjs --url=https://anthropic-atlas.vercel.app && exit 0
          sleep 120
          node scripts/smoke.mjs --url=https://anthropic-atlas.vercel.app && exit 0
          # Unreachable is a hosting problem, not bad data: report it, never revert for it.
          curl -fsS -o /dev/null https://anthropic-atlas.vercel.app/data/atlas.json || { echo "site unreachable"; exit 1; }
          echo "broken=1" >> "$GITHUB_OUTPUT"
      - name: Roll back a broken data update
        if: steps.check.outputs.broken == '1'
        run: |
          if git log -1 --format=%s | grep -q '^health: revert'; then echo "Already reverted once and still broken; a person has to look."; exit 1; fi
          files=$(git diff --no-renames --name-only HEAD~1 HEAD)
          echo "$files"
          if echo "$files" | grep -qvE '^(data/|pipeline/)'; then echo "Latest commit touches code; not reverting automatically."; exit 1; fi
          # Prove the data is the cause: this commit must fail locally and its parent must pass.
          if node scripts/smoke.mjs; then echo "HEAD passes locally; the problem is elsewhere. Not reverting."; exit 1; fi
          git worktree add -q /tmp/prev HEAD~1
          if ! ATLAS_ROOT=/tmp/prev node scripts/smoke.mjs; then echo "The previous version fails too. Not reverting."; exit 1; fi
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ]; then git revert -m 1 --no-edit HEAD; else git revert --no-edit HEAD; fi
          git commit --amend -m "health: revert $(git log -1 --format=%h HEAD~1), production smoke test failed twice"
          for i in 1 2 3; do git push origin HEAD:main && exit 1; git pull --rebase origin main; done
          exit 1
