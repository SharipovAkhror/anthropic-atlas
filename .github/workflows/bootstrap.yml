name: Bootstrap (temporary)
on:
  push:
    branches: [claude/project-thread-3tli56]
permissions:
  contents: write
jobs:
  bootstrap:
    if: contains(github.event.head_commit.message, '[bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/enrich.mjs
      - run: node scripts/collect.mjs
      - run: node scripts/validate.mjs --quiet
      - run: |
          git config user.name "atlas-bot"; git config user.email "atlas-bot@users.noreply.github.com"
          git add -A data assets pipeline; git commit -m "bootstrap: enrich + collect baseline" && git push origin HEAD:${GITHUB_REF_NAME}
